<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What-If World</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a66; --line: #e3e1da;
    --up: #c2410c; --down: #1d4ed8; --accent: #1d1d1b; --soft: #efede6; --new: #15803d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1d1d1b; --ink: #ecebe6; --muted: #9a998f; --line: #2f2e2a;
            --up: #fb923c; --down: #60a5fa; --accent: #ecebe6; --soft: #26251f; --new: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  header { padding: 20px 24px 8px; display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.02em; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .when { color: var(--muted); font-variant-numeric: tabular-nums; }
  main { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(380px, 1.2fr); gap: 16px; padding: 8px 24px 32px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 8px 16px 24px; } header { padding: 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  textarea { width: 100%; min-height: 78px; resize: vertical; border: 1px solid var(--line); border-radius: 8px;
             padding: 10px 12px; font: inherit; background: var(--bg); color: var(--ink); }
  input[type=search] { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
                       font: inherit; background: var(--bg); color: var(--ink); margin-bottom: 10px; }
  .buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { border: 1px solid var(--line); background: var(--soft); color: var(--ink); border-radius: 8px;
           padding: 8px 14px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: wait; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { padding: 5px 12px; font-size: 13px; }
  .tabs button.on { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  .status { color: var(--muted); font-size: 13px; margin-top: 8px; min-height: 20px; }
  .status.error { color: var(--up); }
  .examples { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .examples span { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px;
                   padding: 2px 10px; cursor: pointer; }
  .week { border-top: 1px solid var(--line); padding: 14px 0; }
  .week:first-child { border-top: 0; padding-top: 0; }
  .week h3 { margin: 0 0 4px; font-size: 14px; color: var(--muted); font-weight: 600; }
  .event { font-weight: 600; margin: 2px 0 6px; }
  .narrative { margin: 4px 0 8px; }
  details { margin-top: 6px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  ul { margin: 6px 0; padding-left: 18px; }
  li { margin: 2px 0; }
  .tree, .tree ul { list-style: none; padding-left: 0; margin: 4px 0; }
  .tree ul { padding-left: 16px; border-left: 1px solid var(--line); margin-left: 6px; }
  .tree li { padding-left: 8px; margin: 3px 0; }
  .root-ev { font-weight: 600; }
  .root-ev > ul { font-weight: 400; }
  .up { color: var(--up); font-variant-numeric: tabular-nums; }
  .down { color: var(--down); font-variant-numeric: tabular-nums; }
  .zero { color: var(--muted); opacity: .6; }
  .st { color: var(--ink); font-style: italic; }
  .badge { font-size: 11px; color: var(--new); border: 1px solid var(--new); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  .small { font-size: 13px; color: var(--muted); }
  .link { font-size: 12px; color: var(--muted); }
  .clickable { cursor: pointer; }
  .clickable:hover { text-decoration: underline; }
  .group { margin-bottom: 12px; }
  .group h4 { margin: 0 0 4px; font-size: 13px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .row:hover, .row.sel { background: var(--soft); }
  .row .v { text-align: right; white-space: nowrap; }
  .tablewrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--panel); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  td.cell { cursor: pointer; }
  td.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .chart { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
  .chart h4 { margin: 0 0 6px; font-size: 14px; }
  svg text { fill: var(--muted); font-size: 11px; }
  .conf { font-size: 13px; border-radius: 8px; padding: 6px 10px; margin: 6px 0 8px; border: 1px solid var(--line); color: var(--muted); }
  .conf b { color: var(--ink); }
  .conf-low { border-color: var(--up); background: color-mix(in srgb, var(--up) 10%, transparent); }
  .conf-low b { color: var(--up); }
  .exp { border-top: 1px solid var(--line); padding: 10px 0; }
  .exp:first-of-type { border-top: 0; }
  .exp .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .exp .x { font-size: 12px; padding: 2px 8px; }
  .bar { display: grid; grid-template-columns: minmax(90px, 40%) 1fr 48px; gap: 8px; align-items: center; font-size: 13px; margin-top: 4px; }
  .bar .track { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--ink); opacity: .55; }
  .bar .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .src { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  #expform { display: none; margin-top: 10px; }
  #expform.on { display: block; }
  #expform input, #expform textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
             font: inherit; background: var(--bg); color: var(--ink); margin-bottom: 6px; }
  .surprise { font-size: 13px; border-radius: 8px; padding: 6px 10px; margin: 6px 0; background: var(--soft); }
  details.panel > summary { cursor: pointer; list-style: revert; }
  h3.sub { font-size: 14px; margin: 16px 0 8px; }
  .qrow { display: grid; grid-template-columns: 1fr 2.2fr 70px auto; gap: 6px; align-items: center; margin-top: 6px; }
  @media (max-width: 600px) { .qrow { grid-template-columns: 1fr 1fr; } }
  .qrow input { border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: inherit; background: var(--bg); color: var(--ink); min-width: 0; }
  .qrow .x { padding: 4px 8px; font-size: 12px; }
  .qhead { display: grid; grid-template-columns: 1fr 2.2fr 70px auto; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 12px; }
  @media (max-width: 600px) { .qhead { display: none; } }
  .ai { font-size: 11px; color: var(--muted); }
  .qcols { display: grid; gap: 10px; margin: 10px 0 14px; }
  .qcol { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: 13px; min-width: 0; }
  .qcol h4 { margin: 0 0 2px; font-size: 15px; }
  table.qt { table-layout: fixed; }
  table.qt th, table.qt td { white-space: normal; }
  table.qt th:first-child, table.qt td:first-child { width: 34%; position: static; }
  .branchbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 0 24px 8px; font-size: 14px; }
  @media (max-width: 900px) { .branchbar { padding: 0 16px 8px; } }
  select, .branchbar input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit;
           background: var(--panel); color: var(--ink); }
  .branchbar button { padding: 6px 12px; font-size: 13px; }
  #newform { display: none; gap: 6px; align-items: center; flex-wrap: wrap; }
  #newform.on { display: flex; }
  table.cmp { table-layout: fixed; min-width: 480px; }
  .cmp th, .cmp td { white-space: normal; vertical-align: top; }
  .cmp th:first-child, .cmp td:first-child { width: 40%; position: static; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  @media (max-width: 600px) { .cols { grid-template-columns: 1fr; } }
  .col { border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-size: 13px; }
  .col b { font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>What-If World</h1>
  <div class="when" id="when"></div>
</header>
<main>
  <section>
    <div class="panel">
      <h2>무엇이 궁금한가요?</h2>
      <textarea id="question" placeholder="질문을 적어보세요. 예: 연준 10월 금리 결정은 어떻게 될까? / 중국이 대만을 봉쇄하면?"></textarea>
      <div class="examples" id="qexamples"></div>
      <details id="ctx" style="margin-top:8px"><summary class="small"><b>오늘의 세계 상황</b> — AI가 모르는 최근 소식을 적어두면 훨씬 정확해져요 <span id="ctxinfo"></span></summary>
        <textarea id="ctxtext" rows="6" style="margin-top:6px" placeholder="한 줄에 하나씩. 예:&#10;오늘(10/28) CME FedWatch: 동결 80%, 인하 20%&#10;금값은 이번 달 사상 최고치 근처&#10;호르무즈 해협은 9월부터 사실상 막혀 있음"></textarea>
        <div class="buttons" style="margin-top:4px"><button id="ctxsave">상황 저장</button></div>
        <div id="todaybox" class="small" style="margin-top:8px"></div>
      </details>
      <div class="buttons"><button class="primary" id="qsuggest">가능한 결과 만들기</button></div>
      <div id="qdraft"></div>
      <div class="status" id="status"></div>
    </div>
    <details class="panel" id="detail" style="margin-top:16px">
      <summary><b>한 주씩 직접 진행하기</b> <span class="small">(자세히: 갈래, 사건, 시장 예상)</span></summary>
      <div class="branchbar" style="padding:12px 0 4px">
        <span class="small">갈래</span>
        <select id="branch"></select>
        <button id="newbtn">새 갈래</button>
        <button id="delbtn">이 갈래 지우기</button>
        <span id="newform">
          <input id="newname" placeholder="갈래 이름 (예: 금리 동결)" size="18">
          <span class="small">몇 주 차에서 갈라질까</span>
          <select id="newweek"></select>
          <button class="primary" id="newok">만들기</button>
        </span>
        <span class="small" id="parentinfo"></span>
      </div>
      <h3 class="sub">작가의 손</h3>
      <textarea id="event" placeholder="사건을 입력하세요. 비워두면 사건 없이 한 주가 흘러가요."></textarea>
      <div class="examples" id="examples"></div>
      <div class="buttons">
        <button class="primary" id="step">한 주 진행</button>
        <button id="undo">되돌리기</button>
        <button id="reset">처음부터</button>
      </div>
      <h3 class="sub">시장 예상 <span class="small">(시장이 이미 가격에 반영한 것)</span></h3>
      <div id="exps"></div>
      <div class="buttons"><button id="expbtn">예상 추가</button></div>
      <div id="expform">
        <input id="exptopic" placeholder="무엇에 대한 예상? (예: 미국 연준 10월 금리 결정)">
        <textarea id="expouts" rows="3" placeholder="결과와 확률을 한 줄에 하나씩&#10;인하 0.25%p: 70&#10;동결: 30"></textarea>
        <div class="buttons" style="margin-top:0"><button class="primary" id="expok">저장</button></div>
      </div>
    </details>
    <div class="panel" style="margin-top:16px">
      <h2>세계의 이야기 <span class="small" id="storyof"></span></h2>
      <div id="timeline"></div>
    </div>
  </section>
  <section class="panel">
    <div class="tabs" id="tabs">
      <button data-tab="question">질문 결과</button>
      <button data-tab="chain">영향의 사슬</button>
      <button data-tab="changes">달라진 것들</button>
      <button data-tab="compare">갈래 비교</button>
      <button data-tab="table">기본 지표 표</button>
    </div>
    <div id="view"></div>
    <div class="chart" id="chart"></div>
  </section>
</main>
<script>
const KO = {
  gdp_growth: "성장률", inflation: "물가상승률", unemployment: "실업률", policy_rate: "기준금리",
  stocks: "주가", currency: "통화가치", approval: "정부 지지율", food_prices: "식료품값", fuel_prices: "연료값",
  oil: "유가", gas: "천연가스", wheat: "밀", gold: "금", shipping_cost: "해운 운임", fear: "시장 공포",
  "United States": "미국", "China": "중국", "European Union": "EU", "United Kingdom": "영국", "Japan": "일본",
  "South Korea": "한국", "India": "인도", "Russia": "러시아", "Ukraine": "우크라이나", "Israel": "이스라엘",
  "Iran": "이란", "Saudi Arabia": "사우디", "Brazil": "브라질", "global": "세계"
};
const EXAMPLES = ["이란이 호르무즈 해협을 다시 완전히 막는다", "한국은행이 기준금리를 2%p 올린다",
                  "러시아와 우크라이나가 휴전에 합의한다", "전 세계 밀 수확이 가뭄으로 30% 줄어든다"];
let data = null, sel = "global.oil", tab = "question", query = "";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const scopeName = it => KO[it.scope] || it.scope_label || it.scope;
const itemName = it => it.basic ? ((it.scope === "United States" && it.name === "currency") ? "달러 지수" : (KO[it.name] || it.label)) : it.label;
const fullName = it => `${scopeName(it)} · ${itemName(it)}`;

function fmtVal(v, unit, status) {
  if (unit === "status") return `<span class="st">${esc(status || "변화 없음")}</span>`;
  if (Math.abs(v) < 0.05) return `<span class="zero">0</span>`;
  const sign = v > 0 ? "+" : "";
  const txt = unit === "count" ? sign + Math.round(v).toLocaleString("ko-KR")
            : sign + v.toFixed(1) + (unit === "pp" ? "%p" : "%");
  return `<span class="${v > 0 ? "up" : "down"}">${txt}</span>`;
}
const fmtChange = c => c.unit === "status" ? `→ <span class="st">${esc(c.status)}</span>` : fmtVal(c.change, c.unit);

async function call(path, body) {
  const r = await fetch(path, {method: body ? "POST" : "GET",
    headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

// ---------- chains ----------
function allChanges() {
  const map = {}, kids = {};
  for (const h of data.history) for (const c of h.changes) { map[c.id] = {...c, week: h.week}; }
  for (const c of Object.values(map)) for (const p of c.caused_by || [])
    if (p !== "event" && map[p]) (kids[p] = kids[p] || []).push(c.id);
  return {map, kids};
}
function changeLine(c, showWeek) {
  const it = data.state.items[c.item] || c;
  return `<span class="clickable" data-item="${esc(c.item)}">${esc(fullName(it))}</span> ${fmtChange(c)}`
    + (c.new ? `<span class="badge">새 항목</span>` : "")
    + (c.capped ? ` <span class="small">(한 주 한도로 잘림)</span>` : "")
    + (showWeek ? ` <span class="link">${c.week}주 차</span>` : "")
    + (c.reason ? ` <span class="small">— ${esc(c.reason)}</span>` : "");
}
function subtree(id, map, kids, seen, crossWeek) {
  if (seen.has(id)) return "";
  seen.add(id);
  const c = map[id];
  const ch = (kids[id] || []).filter(k => crossWeek || map[k].week === c.week);
  return `<li>${changeLine(c, crossWeek)}${ch.length ? `<ul>${ch.map(k => subtree(k, map, kids, seen, crossWeek)).join("")}</ul>` : ""}</li>`;
}
function weekTree(h, map, kids) {
  const seen = new Set();
  const inWeek = h.changes.map(c => c.id);
  const fromEvent = inWeek.filter(id => (map[id].caused_by || []).includes("event"));
  const fromPast = inWeek.filter(id => !fromEvent.includes(id) &&
                   (map[id].caused_by || []).some(p => map[p] && map[p].week < h.week));
  let html = "";
  if (fromEvent.length) html += `<li class="root-ev">이번 주 사건<ul>${fromEvent.map(id => subtree(id, map, kids, seen, false)).join("")}</ul></li>`;
  for (const id of fromPast) {
    if (seen.has(id)) continue;
    const parents = map[id].caused_by.filter(p => map[p] && map[p].week < h.week).map(p => map[p]);
    html += `<li><span class="link">← ${parents.map(p => `${p.week}주 차 ${esc(fullName(data.state.items[p.item] || p))}`).join(", ")} 때문에</span><ul>${subtree(id, map, kids, seen, false)}</ul></li>`;
  }
  const rest = inWeek.filter(id => !seen.has(id));
  if (rest.length) html += `<li class="root-ev">그 밖의 흐름<ul>${rest.map(id => subtree(id, map, kids, seen, false)).join("")}</ul></li>`;
  return html ? `<ul class="tree">${html}</ul>` : `<p class="small">달라진 것 없음</p>`;
}

const CONF = {high: ["확신 높음", "conf-high"], medium: ["확신 중간", "conf-mid"], low: ["확신 낮음 · 전례 없음", "conf-low"]};
function confLine(h) {
  if (!h.confidence) return "";
  const [t, c] = CONF[h.confidence];
  const carried = h.confidence_model && h.confidence_model !== h.confidence
    ? ` <span class="small">(이번 주만 보면 ${CONF[h.confidence_model][0]}이지만, 앞선 주의 불확실성을 이어받음)</span>` : "";
  return `<div class="conf ${c}"><b>${t}</b>${carried}${h.uncertainty ? ` — ${esc(h.uncertainty)}` : ""}</div>`;
}

// ---------- views ----------
function render() {
  const {state, history} = data;
  $("when").textContent = `${state.date} · ${state.week}주 차 · 추적 중인 항목 ${Object.keys(state.items).length}개`;
  const {map, kids} = allChanges();
  $("timeline").innerHTML = history.length ? [...history].reverse().map(h => `
    <div class="week">
      <h3>${stepLabel(h)} · ${h.date}</h3>
      ${h.event ? `<div class="event">사건: ${esc(h.event)}</div>` : ""}
      <div class="narrative">${esc(h.narrative)}</div>
      ${surpriseLine(h)}
      ${confLine(h)}
      ${weekTree(h, map, kids)}
      <details><summary>해석 · 참고한 과거 사례 · 각자의 대응</summary>
        <p class="small">${esc(h.interpretation)}</p>
        ${h.analogs.length ? `<ul>${h.analogs.map(a => `<li><b>${esc(a.case)}</b>${a.from_list === false ? " <span class='small'>(목록 밖, AI 기억 · 확인 필요)</span>" : ""}: ${esc(a.why)}</li>`).join("")}</ul>` : "<p class='small'>참고한 과거 사례 없음</p>"}
        ${h.actions.length ? `<ul>${h.actions.map(a => `<li><b>${esc(a.actor)}</b>: ${esc(a.action)}</li>`).join("")}</ul>` : ""}
        ${h.dropped && h.dropped.length ? `<p class="small">코드가 버린 제안 ${h.dropped.length}개: ${h.dropped.map(d => esc(d.why_dropped)).join(", ")}</p>` : ""}
      </details>
    </div>`).join("") : `<p class="small">아직 아무 일도 일어나지 않았어요.</p>`;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  renderBranches();
  renderExps();
  if (document.activeElement !== $("ctxtext")) $("ctxtext").value = (data.config.context || []).join("\n");
  const td = data.today || {lines: []};
  $("ctxinfo").textContent = td.updated ? `· 자동 업데이트 ${td.updated.replace("T", " ").slice(0, 16)}` : `(${(data.config.context || []).length}줄)`;
  $("todaybox").innerHTML = td.lines.length ? `<b>자동으로 모은 오늘 소식</b> (${esc(td.updated.replace("T", " ").slice(0, 16))})
    <ul>${td.lines.map(l => `<li>${esc(l)}</li>`).join("")}</ul>
    ${td.sources.length ? `<details><summary>출처 ${td.sources.length}개</summary><ul>${td.sources.map(u => `<li>${/^https?:\/\//.test(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>` : esc(u)}</li>`).join("")}</ul></details>` : ""}`
    : `아직 자동 업데이트된 소식이 없어요.`;
  $("storyof").textContent = `· 갈래: ${data.active}`;
  if (tab === "question") { viewQuestion(); return; }
  if (tab === "changes") viewChanges(); else if (tab === "chain") viewChain(map, kids);
  else if (tab === "compare") { viewCompare(); return; } else viewTable();
  document.querySelectorAll("[data-item]").forEach(el => el.onclick = () => { sel = el.dataset.item; render(); });
  renderChart();
}

function viewChanges() {
  const items = Object.entries(data.state.items)
    .filter(([id, it]) => it.value || it.status)
    .filter(([id, it]) => !query || fullName(it).toLowerCase().includes(query) || it.scope.toLowerCase().includes(query));
  if (!items.length) { $("view").innerHTML = `<input type="search" id="q" placeholder="검색 (나라, 항목)" value="${esc(query)}"><p class="small">아직 달라진 것이 없어요.</p>`; bindSearch(); return; }
  const groups = {};
  for (const [id, it] of items) (groups[scopeName(it)] = groups[scopeName(it)] || []).push([id, it]);
  const order = Object.entries(groups).sort((a, b) =>
    Math.max(...b[1].map(x => Math.abs(x[1].value) + (x[1].status ? 50 : 0))) - Math.max(...a[1].map(x => Math.abs(x[1].value) + (x[1].status ? 50 : 0))));
  $("view").innerHTML = `<input type="search" id="q" placeholder="검색 (나라, 항목)" value="${esc(query)}">` +
    order.map(([g, list]) => `<div class="group"><h4>${esc(g)}</h4>${list
      .sort((a, b) => Math.abs(b[1].value) - Math.abs(a[1].value))
      .map(([id, it]) => `<div class="row ${sel === id ? "sel" : ""}" data-item="${esc(id)}"><span>${esc(itemName(it))}${it.basic ? "" : `<span class="badge">${it.created_week}주 차에 생김</span>`}</span><span class="v">${fmtVal(it.value, it.unit, it.status)}</span></div>`).join("")}</div>`).join("");
  bindSearch();
}
function bindSearch() {
  const q = $("q");
  q.oninput = () => { query = q.value.toLowerCase(); viewChanges(); document.querySelectorAll("[data-item]").forEach(el => el.onclick = () => { sel = el.dataset.item; render(); }); const n = $("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

function viewChain(map, kids) {
  const evWeeks = data.history.filter(h => h.event);
  if (!evWeeks.length) { $("view").innerHTML = `<p class="small">사건을 넣으면 그 사건에서 시작된 영향이 몇 주에 걸쳐 어떻게 퍼졌는지 여기 나무처럼 보여요.</p>`; return; }
  $("view").innerHTML = evWeeks.slice().reverse().map(h => {
    const seen = new Set();
    const roots = h.changes.filter(c => (c.caused_by || []).includes("event")).map(c => c.id);
    return `<div class="group"><h4>${stepLabel(h)} 사건: ${esc(h.event)}</h4>
      <ul class="tree">${roots.map(id => subtree(id, map, kids, seen, true)).join("") || "<li class='small'>직접 연결된 변화 없음</li>"}</ul>
      <p class="small">영향받은 항목 ${seen.size}개 · 이후 주차까지 이어진 연결 포함</p></div>`;
  }).join("");
}

const stepLabel = h => h.span === "day" ? `${h.week}단계(하루)` : `${h.week}주 차`;

// ---------- question mode ----------
const QEXAMPLES = ["연준 10월 금리 결정은?", "중국이 대만을 봉쇄하면?", "미국 중간선거 하원은 누가 가져갈까?", "러시아-우크라이나 협상은 어떻게 될까?"];

async function busy(msg, fn) {
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  $("status").className = "status"; $("status").textContent = msg;
  try { await fn(); $("status").textContent = ""; }
  catch (e) { $("status").className = "status error"; $("status").textContent = "오류: " + e.message; }
  finally { document.querySelectorAll("button").forEach(b => b.disabled = false); }
}

function suggestOutcomes() {
  const q = $("question").value.trim();
  if (!q) { $("status").className = "status error"; $("status").textContent = "질문을 먼저 적어주세요."; return; }
  busy("가능한 결과를 생각하는 중… (10~20초)", async () => {
    const r = await call("/api/question/outcomes", {question: q, n: 3});
    qDraft = {question: q, outcomes: r.outcomes};
    renderQDraft();
  });
}

function runQuestion() {
  const n = qDraft.outcomes.filter(o => o.event.trim()).length;
  busy(`결과 ${n}개의 세계를 동시에 돌리는 중… (30초~2분)`, async () => {
    data = await call("/api/question/run", {question: qDraft.question, outcomes: qDraft.outcomes,
      weeks: +$("qweeks").value, span: $("qspan").value, start: $("qstart").value});
    qDraft = null; renderQDraft(); $("question").value = "";
    qSel = data.questions.length - 1; tab = "question"; render();
  });
}

    <p class="small">${q.from_branch === "(새 현재 세계)" ? "깨끗한 현재 세계" : `'${esc(q.from_branch)}' ${q.from_week}단계`}에서 출발해 ${unit} 단위로 ${q.weeks}번 돌렸어요. 숫자는 모두 <b>질문을 던진 시점 대비</b> 변화예요. 기록 시각 ${q.asked.replace("T", " ").slice(0, 16)}.</p>
    <div class="qcols" style="grid-template-columns: repeat(${Math.min(q.outcomes.length, 3)}, minmax(0, 1fr))">
      ${q.outcomes.map((o, i) => { const hs = worlds[i].history.slice(start);

          ${hs[0] ? surpriseLine(hs[0]) + confLine(hs[hs.length - 1]) : ""}
          ${hs.map(h => `<p><b>${stepLabel(h)}</b> ${esc(h.narrative)}</p>`).join("")}
          <button class="x" data-open="${esc(o.branch)}">이 세계 자세히 보기</button></div>`; }).join("")}
    </div>
    ${diffTable(q, worlds)}
    ${scoreBox(q)}`;

// ---------- prediction log: score a question after the event ----------
function pct(x) { return x === null || x === undefined ? "–" : (x > 0 ? "+" : "") + (+x).toFixed(2) + "%"; }
function scoreTable(title, s) {
  return `<p><b>${title}</b>: 방향 ${s.hits}/${s.count} 맞음 · 평균 크기 오차 ${s.mean_error ?? "–"}%p</p>
    <table><tr><th>시장</th><th>예측</th><th>실제</th><th>방향</th></tr>
    ${s.rows.map(r => `<tr><td>${esc(r.label)}</td><td>${pct(r.predicted)}</td><td>${pct(r.actual)}</td><td>${r.hit ? "✅" : "❌"}</td></tr>`).join("")}</table>`;
}
function scoreBox(q) {
  const sb = data.scoreboard || {};
  const total = sb.questions ? `<p class="small">지금까지 채점한 질문 ${sb.questions}개 · 실제 결과 기준 방향 ${sb.outcome_score.hits}/${sb.outcome_score.count} · 결과 모를 때 예측 기준 방향 ${sb.forecast_score.hits}/${sb.forecast_score.count}</p>` : "";
  const r = q.result;
  const done = r ? `<p class="small">실제로 일어난 결과: <b>${esc(r.happened)}</b> · 실제 숫자 출처: ${esc(r.source)} · 채점 ${esc((r.scored || "").replace("T", " ").slice(0, 16))}</p>
    ${scoreTable("실제 결과의 세계", r.outcome_score)}
    ${scoreTable("결과를 모를 때의 예측 (확률로 섞은 평균)", r.forecast_score)}
    <p class="small">자동매매에 쓸 수 있는 건 두 번째 표예요. 매매는 결과를 모르는 상태에서 해야 하니까요.</p>` : "";
  const names = q.outcomes.map(o => `<option>${esc(o.name)}</option>`).join("");
  const manual = Object.entries(data.markets || {}).map(([id, label]) =>
    `<label class="small" style="display:inline-block;margin:2px 8px 2px 0">${esc(label)} <input data-act="${id}" type="number" step="0.01" style="width:70px">%</label>`).join("");
  return `<details class="score" ${r ? "open" : ""}><summary><b>예측 채점</b> ${r ? "(채점됨)" : "(이벤트가 끝나면 채점)"}</summary>
    ${total}${done}
    <p class="small">이벤트가 끝난 뒤, 실제로 일어난 결과를 고르고 채점을 누르세요. 실제 시장 숫자는 자동 업데이트 기록(질문 시점 → 가장 최근)에서 가져와요. 숫자를 직접 넣으면 그걸 써요.</p>
    <div class="buttons"><select id="shappened">${names}</select>
      <button class="primary" id="sgo">${r ? "다시 채점" : "채점"}</button></div>
    <details><summary class="small">실제 변화 직접 입력 (선택)</summary>${manual}</details></details>`;
}
function bindScore(q) {
  const b = $("sgo"); if (!b) return;
  if (q.result) $("shappened").value = q.result.happened;
  b.onclick = () => {
    const actual = {};
    document.querySelectorAll("[data-act]").forEach(el => { if (el.value !== "") actual[el.dataset.act] = +el.value; });
    busy("채점하는 중…", async () => {
      data = await call("/api/question/resolve", {index: q.index, happened: $("shappened").value,
        actual: Object.keys(actual).length ? actual : null});
      render();
    });
  };
}

function baseOf(w, q, id) {
  const h = q.from_week > 0 ? w.history[q.from_week - 1] : null;
  const it = h && h.state.items[id];
  return it ? it.value : 0;
}
function rel(v, b, unit) {  // change since the question was asked
  return unit === "%" ? ((1 + v / 100) / (1 + b / 100) - 1) * 100 : v - b;
}
function diffTable(q, worlds) {
  const ids = new Set(); worlds.forEach(w => Object.keys(w.state.items).forEach(id => ids.add(id)));
  const num = [], st = [];
  for (const id of ids) {
    const its = worlds.map(w => w.state.items[id]);
    const it = its.find(Boolean);
    if (it.unit === "status") {
      const vals = its.map(x => x ? x.status : "");
      if (new Set(vals).size > 1) st.push({id, it, vals});
    } else {
      const vals = its.map((x, k) => rel(x ? x.value : 0, baseOf(worlds[k], q, id), it.unit));
      const spread = Math.max(...vals.map(Math.abs), Math.max(...vals) - Math.min(...vals));
      if (spread >= 0.05) num.push({id, it, vals, spread});
    }
  }
  num.sort((a, b) => b.spread - a.spread);
  const head = `<tr><th>결과에 따라 가장 크게 달라지는 것</th>${q.outcomes.map(o => `<th>${esc(o.name)}</th>`).join("")}</tr>`;
  return (num.length ? `<div class="tablewrap"><table class="qt">${head}${num.slice(0, 12).map(r => `<tr><td><span class="clickable" data-item="${esc(r.id)}">${esc(fullName(r.it))}</span></td>${r.vals.map(v => `<td>${fmtVal(v, r.it.unit)}</td>`).join("")}</tr>`).join("")}</table></div>` : `<p class="small">결과마다 숫자가 아직 같아요.</p>`)
    + (st.length ? `<h4 style="margin:14px 0 6px;font-size:13px">상태가 달라진 것</h4><div class="tablewrap"><table class="qt">${st.slice(0, 6).map(r => `<tr><td>${esc(fullName(r.it))}</td>${r.vals.map(v => `<td>${v ? `<span class="st">${esc(v)}</span>` : `<span class="zero">변화 없음</span>`}</td>`).join("")}</tr>`).join("")}</table></div>` : "");
}

function renderChartMulti(q, worlds) {
  const it = worlds.map(w => w.state.items[sel]).find(Boolean);
  if (!it || it.unit === "status") return;
  const series = worlds.map(w => [0, ...w.history.slice(q.from_week).map(h => rel(h.state.items[sel] ? h.state.items[sel].value : 0, baseOf(w, q, sel), it.unit))]);
  const all = series.flat(), lo = Math.min(0, ...all), hi = Math.max(0, ...all), span = (hi - lo) || 1, len = Math.max(...series.map(s => s.length));
  const W = 560, H = 180, P = 32, x = i => P + (W - 2*P) * (len === 1 ? 0 : i / (len - 1)), y = v => H - P + 8 - (H - 2*P) * (v - lo) / span;
  const dash = ["", "6 4", "2 3", "10 3 2 3"];
  $("chart").innerHTML = `<h4>${esc(fullName(it))}</h4><svg viewBox="0 0 ${W} ${H}" width="100%">
    <line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" opacity=".2"/>
    ${series.map((s, k) => `<path d="${s.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ")}" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="${dash[k % 4]}"/>`).join("")}
    <text x="4" y="${y(hi)+4}">${hi.toFixed(1)}</text><text x="4" y="${y(lo)+4}">${lo.toFixed(1)}</text></svg>
    <div class="small">${q.outcomes.map((o, k) => `<span style="margin-right:12px"><svg width="26" height="8"><line x1="0" x2="26" y1="4" y2="4" stroke="currentColor" stroke-width="2" stroke-dasharray="${dash[k % 4]}"/></svg> ${esc(o.name)}</span>`).join("")}</div>`;
}

function renderExps() {
  const exps = Object.entries(data.state.expectations || {});
  $("exps").innerHTML = exps.length ? exps.map(([id, e]) => `
    <div class="exp"><div class="top"><span><b>${esc(e.topic)}</b><span class="src">${e.source === "AI" ? `AI · ${e.week}주 차` : "작가"}</span></span>
      <button class="x" data-del="${esc(id)}">지우기</button></div>
      ${Object.entries(e.outcomes).map(([o, p]) => `<div class="bar"><span>${esc(o)}</span><span class="track"><span class="fill" style="display:block;width:${p}%"></span></span><span class="pct">${p.toFixed(0)}%</span></div>`).join("")}
    </div>`).join("") : `<p class="small">아직 없어요. 예를 들어 "연준 금리 결정: 인하 70%, 동결 30%"를 넣어두면, 결과가 예상과 같을 때는 시장이 조금만, 예상 밖일 때는 크게 반응해요.</p>`;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => act("/api/expect/delete", {id: b.dataset.del}, "예상을 지우는 중…"));
}
function surpriseLine(h) {
  if (!h.surprise) return "";
  const s = h.surprise, lvl = s.surprise >= 60 ? "큰 놀람" : s.surprise >= 30 ? "보통 놀람" : "예상대로";
  return `<div class="surprise"><b>${lvl}</b> — "${esc(s.topic)}"에서 시장은 "${esc(s.outcome)}" 결과를 ${s.expected.toFixed(0)}% 확률로 예상했어요. 놀람 정도 ${s.surprise.toFixed(0)}%.</div>`;
}

function renderBranches() {
  const {branches, active, state} = data;
  $("branch").innerHTML = branches.map(b => `<option value="${esc(b.name)}" ${b.name === active ? "selected" : ""}>${esc(b.name)} (${b.week}주 차)</option>`).join("");
  const me = branches.find(b => b.name === active);
  $("parentinfo").textContent = me && me.parent ? `← '${me.parent.branch}'의 ${me.parent.week}주 차에서 갈라짐` : "";
  $("newweek").innerHTML = Array.from({length: state.week + 1}, (_, i) => `<option value="${i}" ${i === state.week ? "selected" : ""}>${i}주 차</option>`).join("");
  $("delbtn").disabled = branches.length < 2;
}

let cmp = {a: null, b: null};
async function viewCompare() {
  const names = data.branches.map(b => b.name);
  if (names.length < 2) {
    $("view").innerHTML = `<p class="small">갈래가 하나뿐이에요. 위의 <b>새 갈래</b>로 같은 시점에서 갈라지는 다른 세계를 만들면, 두 세계를 여기서 나란히 비교할 수 있어요.<br><br>예: 2주 차에서 갈래를 만들고, 원래 갈래에는 "금리 인하", 새 갈래에는 "금리 동결"을 넣어보기.</p>`;
    $("chart").innerHTML = ""; return;
  }
  if (!names.includes(cmp.a)) cmp.a = data.active;
  if (!names.includes(cmp.b) || cmp.b === cmp.a) cmp.b = names.find(n => n !== cmp.a);
  const opt = sel => names.map(n => `<option ${n === sel ? "selected" : ""}>${esc(n)}</option>`).join("");
  $("view").innerHTML = `<div class="buttons" style="margin:0 0 12px">A <select id="ca">${opt(cmp.a)}</select> B <select id="cb">${opt(cmp.b)}</select></div><div id="cmpbody" class="small">불러오는 중…</div>`;
  $("chart").innerHTML = "";
  $("ca").onchange = e => { cmp.a = e.target.value; viewCompare(); };
  $("cb").onchange = e => { cmp.b = e.target.value; viewCompare(); };
  const [A, B] = await Promise.all([call("/api/branch?name=" + encodeURIComponent(cmp.a)), call("/api/branch?name=" + encodeURIComponent(cmp.b))]);
  // where do they split?
  let split = 0;
  while (split < A.history.length && split < B.history.length &&
         A.history[split].event === B.history[split].event && A.history[split].narrative === B.history[split].narrative) split++;
  const since = (X) => X.history.slice(split).map(h => `<li>${stepLabel(h)}${h.event ? ` · <b>${esc(h.event)}</b>` : ""}<br>${esc(h.narrative)}${surpriseLine(h)}${confLine(h)}</li>`).join("") || "<li>갈라진 뒤 진행한 주가 없어요</li>";
  const ids = new Set([...Object.keys(A.state.items), ...Object.keys(B.state.items)]);
  const rows = [];
  for (const id of ids) {
    const a = A.state.items[id], b = B.state.items[id], it = a || b;
    const av = a ? a.value : 0, bv = b ? b.value : 0, as = a ? a.status : "", bs = b ? b.status : "";
    if (it.unit === "status" ? as === bs : Math.abs(av - bv) < 0.05) continue;
    rows.push({id, it, av, bv, as, bs, d: it.unit === "status" ? 1e9 : Math.abs(av - bv)});
  }
  rows.sort((x, y) => y.d - x.d);
  const cell = (v, s, it, exists) => exists ? fmtVal(v, it.unit, s) : `<span class="zero">없음</span>`;
  $("cmpbody").innerHTML = `
    <p class="small">${split}주 차까지는 같은 세계, 그 뒤로 갈라졌어요. 차이가 있는 항목 ${rows.length}개.</p>
    <div class="cols"><div class="col"><b>A · ${esc(cmp.a)}</b><ul>${since(A)}</ul></div><div class="col"><b>B · ${esc(cmp.b)}</b><ul>${since(B)}</ul></div></div>
    ${rows.length ? `<div class="tablewrap"><table class="cmp"><tr><th>항목</th><th>A</th><th>B</th><th>B − A</th></tr>
      ${rows.slice(0, 80).map(r => `<tr><td>${esc(fullName(r.it))}</td><td>${cell(r.av, r.as, r.it, !!A.state.items[r.id])}</td><td>${cell(r.bv, r.bs, r.it, !!B.state.items[r.id])}</td><td>${r.it.unit === "status" ? "" : fmtVal(r.bv - r.av, r.it.unit)}</td></tr>`).join("")}
    </table></div>` : `<p class="small">두 세계의 숫자가 아직 같아요.</p>`}`;
}

function renderChart() {
  const it = data.state.items[sel];
  if (!it) { $("chart").innerHTML = ""; return; }
  if (it.unit === "status") {
    const steps = data.history.map(h => [h.week, h.state.items[sel]?.status]).filter(x => x[1]);
    $("chart").innerHTML = `<h4>${esc(fullName(it))}</h4>` + (steps.length ? `<ul>${steps.filter((x, i) => i === 0 || x[1] !== steps[i-1][1]).map(([w, s]) => `<li>${w}주 차: ${esc(s)}</li>`).join("")}</ul>` : `<p class="small">변화 없음</p>`);
    return;
  }
  const pts = [0, ...data.history.map(h => h.state.items[sel] ? h.state.items[sel].value : 0)];
  const W = 560, H = 180, P = 32;
  const lo = Math.min(0, ...pts), hi = Math.max(0, ...pts), span = (hi - lo) || 1;
  const x = i => P + (W - 2*P) * (pts.length === 1 ? 0 : i / (pts.length - 1));
  const y = v => H - P + 8 - (H - 2*P) * (v - lo) / span;
  const path = pts.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const unit = it.unit === "pp" ? "%p (퍼센트포인트)" : it.unit === "count" ? "시작 이후 늘어난 수" : "% (시작 대비)";
  $("chart").innerHTML = `<h4>${esc(fullName(it))}</h4>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="chart">
      <line x1="${P}" x2="${W-P}" y1="${y(0)}" y2="${y(0)}" stroke="currentColor" opacity=".2"/>
      <path d="${path}" fill="none" stroke="currentColor" stroke-width="2"/>
      ${pts.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="currentColor"><title>${i}주 차: ${v.toFixed(1)}</title></circle>`).join("")}
      <text x="${P}" y="${H-6}">0주</text><text x="${W-P}" y="${H-6}" text-anchor="end">${pts.length-1}주</text>
      <text x="4" y="${y(hi)+4}">${hi.toFixed(1)}</text><text x="4" y="${y(lo)+4}">${lo.toFixed(1)}</text>
    </svg><div class="small">단위: ${unit}</div>`;
}

async function act(path, body, msg) {
  document.querySelectorAll("button").forEach(b => b.disabled = true);
  $("status").className = "status"; $("status").textContent = msg;
  try { data = await call(path, body); render(); $("status").textContent = ""; if (path === "/api/step") $("event").value = ""; }
  catch (e) { $("status").className = "status error"; $("status").textContent = "오류: " + e.message; }
  finally { document.querySelectorAll("button").forEach(b => b.disabled = false); }
}

$("qexamples").innerHTML = QEXAMPLES.map(e => `<span>${e}</span>`).join("");
document.querySelectorAll("#qexamples span").forEach(s => s.onclick = () => $("question").value = s.textContent);
$("qsuggest").onclick = suggestOutcomes;
$("ctxsave").onclick = () => act("/api/context", {lines: $("ctxtext").value.split("\n")}, "상황을 저장하는 중…");
$("examples").innerHTML = EXAMPLES.map(e => `<span>${e}</span>`).join("");
document.querySelectorAll("#examples span").forEach(s => s.onclick = () => $("event").value = s.textContent);
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$("step").onclick = () => act("/api/step", {event: $("event").value}, "세계가 반응하는 중… (20~60초)");
$("undo").onclick = () => act("/api/undo", {}, "되돌리는 중…");
$("reset").onclick = () => {
  const r = $("reset");
  if (r.dataset.armed === "1") { r.dataset.armed = ""; r.textContent = "처음부터"; act("/api/reset", {}, "처음으로 돌아가는 중…"); return; }
  r.dataset.armed = "1"; r.textContent = "한 번 더 누르면 초기화";
  setTimeout(() => { r.dataset.armed = ""; r.textContent = "처음부터"; }, 3000);
};
$("expbtn").onclick = () => { $("expform").classList.toggle("on"); $("exptopic").focus(); };
$("expok").onclick = () => {
  const outcomes = {};
  for (const line of $("expouts").value.split("\n")) {
    const m = line.match(/^(.*?)[:：=\s]\s*([0-9]+(?:\.[0-9]+)?)\s*%?\s*$/);
    if (m && m[1].trim()) outcomes[m[1].trim()] = +m[2];
  }
  act("/api/expect/set", {topic: $("exptopic").value, outcomes}, "예상을 저장하는 중…").then(() => {
    if (!$("status").classList.contains("error")) { $("expform").classList.remove("on"); $("exptopic").value = ""; $("expouts").value = ""; }
  });
};
$("branch").onchange = e => act("/api/branch/switch", {name: e.target.value}, "갈래를 바꾸는 중…");
$("newbtn").onclick = () => { $("newform").classList.toggle("on"); $("newname").focus(); };
$("newok").onclick = () => act("/api/branch/new", {name: $("newname").value, from_week: +$("newweek").value}, "갈래를 만드는 중…").then(() => { $("newform").classList.remove("on"); $("newname").value = ""; });
$("delbtn").onclick = () => {
  const d = $("delbtn");
  if (d.dataset.armed === "1") { d.dataset.armed = ""; d.textContent = "이 갈래 지우기"; act("/api/branch/delete", {name: data.active}, "갈래를 지우는 중…"); return; }
  d.dataset.armed = "1"; d.textContent = "한 번 더 누르면 지워져요";
  setTimeout(() => { d.dataset.armed = ""; d.textContent = "이 갈래 지우기"; }, 3000);
};
call("/api/world").then(d => { data = d; render(); }).catch(e => $("status").textContent = "오류: " + e.message);
</script>
